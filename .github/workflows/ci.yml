name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package check
        run: npm run check
